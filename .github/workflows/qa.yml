name: Research QA

on:
  pull_request:
  push:
    branches:
      - stage-004-second-agent-family
      - main

permissions:
  contents: read

jobs:
  unit-and-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install analysis dependencies
        run: python -m pip install -r requirements-analysis.txt

      - name: Compile Python sources
        run: |
          python -m compileall -q src analysis tests

      - name: Run unit and protocol tests
        run: |
          python -m unittest discover -s tests -v

      - name: Verify draft confirmatory lock stays sealed
        run: |
          python - <<'PY'
          from pathlib import Path
          import importlib.util
          import sys

          path = Path('analysis/stage004_llm_hdc.py').resolve()
          spec = importlib.util.spec_from_file_location('stage004_llm_hdc_ci', path)
          mod = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = mod
          spec.loader.exec_module(mod)

          status = mod.lock_status(mod.LOCK_FILE.read_text(encoding='utf-8'))
          assert status == 'DRAFT_DO_NOT_EVALUATE', status
          try:
              mod.assert_phase_allowed('eval')
          except SystemExit:
              pass
          else:
              raise AssertionError('draft lock unexpectedly allowed confirmatory eval')
          PY

      - name: Reject partial confirmatory evaluation
        run: |
          python - <<'PY'
          import importlib.util
          import sys
          from pathlib import Path

          path = Path('analysis/stage004_llm_hdc.py').resolve()
          spec = importlib.util.spec_from_file_location('stage004_llm_hdc_scope_ci', path)
          mod = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = mod
          spec.loader.exec_module(mod)

          for limit, only in ((1, None), (None, ['00dbd492'])):
              try:
                  mod.assert_eval_scope('eval', limit, only)
              except SystemExit:
                  continue
              raise AssertionError('partial confirmatory eval was not rejected')
          PY
